[package]
name = "testgen"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
clap = { version = "4.1", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
tokio = { version = "1.36", features = ["full"] }
num_cpus = "1.16"
walkdir = "2.3"
zip = "0.6"
futures = "0.3"
regex = "1.10"
tempfile = "3.6"
colored = "2.0"

[lib]
name = "testgen"
path = "src/lib.rs"

[workspace]